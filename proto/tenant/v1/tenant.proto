syntax = "proto3";

// Package tenant.v1 is the canonical tenant directory row: the value stored at
// the untenanted system key /tenants/<id>.
//
// It is protobuf for the same reason record bodies are (plan §II.3): a rolling
// upgrade runs mixed binaries against one directory, and an older binary that
// reads a tenant row written by a newer one, then rewrites it, must not destroy
// the fields it never heard of. A fixed-width row could not do that.
//
// The row carries no tenant id: the id is the key, and a second copy inside the
// value is a second thing that can disagree with the first.
package tenant.v1;

option go_package = "github.com/remem-org/remem-go/internal/tenant/tenantkv/pb;pb";

// Tenant is one entry in the directory.
message Tenant {
  // display_name is what an operator calls this tenant. Absent means never
  // set, which is different from set to the empty string.
  optional string display_name = 1;

  // schema_version is the tenant's user-visible schema version (spec §19.3).
  // It is deliberately independent of every storage format version: a Phase 4
  // test bumps one and asserts the other is unmoved.
  uint32 schema_version = 2;

  uint64 created_at_unix_ms = 3;
  uint64 updated_at_unix_ms = 4;
}
